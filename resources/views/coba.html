<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Responsive Table with Sort and Expand/Collapse</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background-color: #1976D2;
            color: #fff;
            padding: 10px;
            text-align: left;
            cursor: pointer;
        }

        td,
        th {
            border: 1px solid #ddd;
            padding: 10px;
        }

        .expand-content {
            display: none;
            background-color: #f1f1f1;
            padding: 10px;
        }

        .expanded+.expand-content {
            display: table-row;
        }

        .toolbox a {
            color: inherit;
            text-decoration: none;
            margin: 0 5px;
            font-size: 18px;
        }

        .toolbox .edit {
            color: #4CAF50;
        }

        .toolbox .remove {
            color: #F44336;
        }

        .expand-icon {
            cursor: pointer;
            float: right;
            font-size: 16px;
            transition: transform 0.3s;
        }

        /* CSS untuk memutar chevron saat baris diperluas */
        .expanded .expand-icon {
            transform: rotate(180deg);
        }

        /* Responsive styling */
        @media screen and (max-width: 520px) {
            table {
                width: 100%;
            }

            thead th {
                display: none;
            }

            tr,
            td {
                display: block;
                width: 100%;
            }

            td {
                text-align: left;
                position: relative;
                padding-left: 50%;
            }

            td::before {
                content: attr(data-header);
                position: absolute;
                left: 10px;
                font-weight: bold;
                text-transform: uppercase;
            }

            .expand-icon {
                float: none;
                position: absolute;
                right: 10px;
                top: 10px;
            }
        }

        /* Flexbox styling untuk data yang sejajar */
        .collapse-data-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .collapse-content,
        .collapse-content1 {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>

    <h3 class="text-center mt-3">Tabel Responsive Dengan Header dan Sort</h3>
    <div class="container my-4">
        <table class="table">
            <thead>
                <tr>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            No. Id
                            <span class="sort-icons sort-button" data-sort="id" data-order="asc"
                                style="display: flex; flex-direction: column; align-items: center; margin-left: 5px; cursor: pointer;">
                                <span class="fas fa-chevron-up" style="font-size: 10px;"></span>
                                <span class="fas fa-chevron-down" style="font-size: 10px;"></span>
                            </span>
                        </span>
                    </th>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            Client Name
                            <span class="sort-icons sort-button" data-sort="client-name" data-order="asc"
                                style="display: flex; flex-direction: column; align-items: center; margin-left: 5px; cursor: pointer;">
                                <span class="fas fa-chevron-up" style="font-size: 10px;"></span>
                                <span class="fas fa-chevron-down" style="font-size: 10px;"></span>
                            </span>
                        </span>
                    </th>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            Email
                            <span class="sort-icons sort-button" data-sort="email" data-order="asc"
                                style="display: flex; flex-direction: column; align-items: center; margin-left: 5px; cursor: pointer;">
                                <span class="fas fa-chevron-up" style="font-size: 10px;"></span>
                                <span class="fas fa-chevron-down" style="font-size: 10px;"></span>
                            </span>
                        </span>
                    </th>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            Phone
                        </span>
                    </th>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            PIC
                            <span class="sort-icons sort-button" data-sort="pic-name" data-order="asc"
                                style="display: flex; flex-direction: column; align-items: center; margin-left: 5px; cursor: pointer;">
                                <span class="fas fa-chevron-up" style="font-size: 10px;"></span>
                                <span class="fas fa-chevron-down" style="font-size: 10px;"></span>
                            </span>
                        </span>
                    </th>
                    <th>
                        <span style="display: inline-flex; align-items: center;">
                            Category
                            <span class="sort-icons sort-button" data-sort="product-category" data-order="asc"
                                style="display: flex; flex-direction: column; align-items: center; margin-left: 5px; cursor: pointer;">
                                <span class="fas fa-chevron-up" style="font-size: 10px;"></span>
                                <span class="fas fa-chevron-down" style="font-size: 10px;"></span>
                            </span>
                        </span>
                    </th>
                    <th>Opsi</th>
                </tr>
            </thead>
            <tbody>
                <tr class="expand-toggle" onclick="toggleExpand(this)">
                    <td data-header="No. Id">1 </td>
                    <td data-header="Client Name">Anton</td>
                    <td data-header="Email">anton@email.com <span class="expand-icon"><i
                                class="fas fa-chevron-down"></i></span></td>
                    <td data-header="Phone">08562136x</td>
                    <td data-header="PIC">John Doe</td>
                    <td data-header="Category">Category A</td>
                    <td scope="row">
                        <div class="toolbox">
                            <a href="#" class="edit"><i class="fas fa-pencil-alt"></i></a>
                            <a href="#" class="remove"><i class="fas fa-trash-alt"></i></a>
                        </div>
                    </td>
                </tr>
                <tr class="expand-content">
                    <td colspan="7">
                        <div class="collapse-data-container">
                            <div class="collapse-content">
                                <span>PT. RIS Tirta Indah</span>
                                <i class="fa-regular fa-copy" onclick="copyText('PT. RIS Tirta Indah')"></i>
                            </div>
                            <div class="collapse-content1">
                                <span>Jl. Prof. Dr. Ida Bagus Mantra Batubulan, Kec. Sukawati, Kabupaten Gianyar, Bali
                                    80582</span>
                                <i class="fa-regular fa-copy"
                                    onclick="copyText('Jl. Prof. Dr. Ida Bagus Mantra Batubulan, Kec. Sukawati, Kabupaten Gianyar, Bali 80582')"></i>
                            </div>
                        </div>
                    </td>
                </tr>
                <!-- Tambahkan baris lain jika diperlukan -->
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-vqqCZgiC5i6m+Xkdm5cxZkBx2eI67iNyyRf0lCRx45VQmV57FFHp2z1LthEl0JLF"
        crossorigin="anonymous"></script>
    <script>
        function toggleExpand(row) {
            // Toggle class untuk expand/collapse
            $(row).toggleClass("expanded");

            // Toggle konten tambahan
            $(row).next(".expand-content").toggle();
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(function () {
                alert("Text copied: " + text);
            }, function (err) {
                console.error("Could not copy text: ", err);
            });
        }

        // Fungsi untuk sorting tabel
        function sortTable(columnIndex) {
            const table = document.querySelector("table tbody");
            const rows = Array.from(table.querySelectorAll("tr.expand-toggle"));
            const expandContents = Array.from(table.querySelectorAll("tr.expand-content"));

            let sortedRows = rows.sort((a, b) => {
                const aText = a.cells[columnIndex].textContent.trim();
                const bText = b.cells[columnIndex].textContent.trim();

                return aText.localeCompare(bText);
            });

            // Toggle ascending and descending
            if (table.getAttribute("data-sort-order") === "asc") {
                sortedRows.reverse();
                table.setAttribute("data-sort-order", "desc");
            } else {
                table.setAttribute("data-sort-order", "asc");
            }

            // Remove rows and reinsert in sorted order
            rows.forEach(row => row.remove());
            expandContents.forEach(content => content.remove());

            sortedRows.forEach(row => {
                table.appendChild(row);
                const expandContent = row.nextElementSibling;
                if (expandContent && expandContent.classList.contains("expand-content")) {
                    table.appendChild(expandContent);
                }
            });
        }

        // Event listener untuk sort button
        document.querySelectorAll('.sort-button').forEach(button => {
            button.addEventListener('click', function () {
                const columnIndex = Array.from(button.parentNode.parentNode.children).indexOf(button.parentNode);
                sortTable(columnIndex);
            });
        });
    </script>

</body>

</html>
